# 🎯 Career-HY RAG 베이스라인 실험 설정
# StructuredDocumentLoader + Recursive Chunking 조합

experiment_name: "gt_eval_recursive"
description: "새로운 StructuredDocumentLoader + Recursive Chunking + 새 GT CSV 기반 - 완전한_검색_쿼리 + 같은_군집_id들 전체를 GT로 사용"
output_dir: "results/new_gt_recursive/"

# 임베딩 설정 (실제 서비스와 동일)
embedder:
  type: "openai"
  model_name: "text-embedding-ada-002"
  batch_size: 5

# 청킹 설정 (Recursive Chunking 적용)
chunker:
  type: "recursive"
  chunk_size: 500
  chunk_overlap: 75

# 검색 설정 (실제 서비스와 동일)
retriever:
  type: "chroma"
  collection_name: "job-postings-keyword-parse-recursive"
  persist_directory: "/tmp/chroma_baseline_v4_recursive"
  top_k: 20 # 최소 20개로 설정 (recall@20 평가 시 )

# LLM 설정 (실제 서비스와 동일)
llm:
  type: "openai"
  model_name: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 1000

# 응답 생성기 설정 (실제 서비스와 동일)
response_generator:
  type: "careerhy"
  model_name: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 2000

# 데이터 설정
data:
  pdf_prefix: "initial-dataset/pdf/"
  json_prefix: "initial-dataset/json/"
  test_queries_path: "data/gt_eval_fullquery_cluster_ids.jsonl"  # 새로운 평가 데이터
  data_version: "v4"  # S3 데이터 버전 (데이터 변경 시 v2, v3으로 증가)

  # StructuredDocumentLoader 기반 섹션별 청킹 파이프라인 옵션
  use_structured_loader: true
  structured_parser_strategy: "fast" # "fast" or "hi_res"
  structured_target_sections:
    - "preferred"
    - "qualifications"
    - "job_duties"

# 검색 성능 평가 전용 설정
evaluation:
  mode: "dual"  # "dual", "retrieval_only", "build_only"
  
  # 평가 지표 (사용자 요청 순서)
  metrics:
    - "ndcg@10"        # 1. 순위 품질 (상위 10개)
    - "mrr@10"         # 2. 첫 정답 순위 (상위 10개)
    - "precision@3"    # 3. 정확도 (상위 3개)
    - "precision@5"    # 4. 정확도 (상위 5개)
    - "precision@10"   # 5. 정확도 (상위 10개)
    - "precision@20"   # 6. 정확도 (상위 20개)
    - "hit@10_count"   # 7. 상위 10개 중 맞은 개수
    - "r_recall"       # 8. Recall@(정답개수)

  # 검색 평가 세부 설정
  retrieval:
    target: "all"     # 모든 쿼리에 대해 검색 평가
  
  # 생성 평가 세부 설정
  generation:
    target: "sample"  # 샘플만 생성 평가
    sample_size: 10   # 생성 평가에 사용할 쿼리 개수
    sample_strategy: "random"  # random 샘플링 (시드 고정으로 재현 가능)
    sample_seed: 42   # 고정 시드 (다른 설정과 동일한 쿼리 선택)
    
  # 결과 저장 설정
  save_results: true  # 검색 결과 JSONL 저장 (분석용)
  results_dir: "results/new_gt_recursive/results"  # 결과 저장 디렉토리

# LangSmith 고품질 정성 평가 (선택사항)
langsmith:
  enabled: true
  project_name: "career-hy-new_gt-recursive"
  judge_model: "gpt-4o-mini"
  
  # LangSmith 추적용 태그
  tags:
    - "new_gt"
    - "structured_loader"
    - "recursive-chunking-500-75"
    - "chroma"
    - "ada-002"
    - "gpt-4o-mini"

  # 4가지 정성 평가 지표
  metrics:
    - "recommendation_quality"    # 추천 품질 전반
    - "personalization_score"     # 개인화 수준
    - "response_helpfulness"      # 도움이 되는 정도
    - "profile_alignment"         # 프로필 일치도

  # 비용 최적화 설정
  max_concurrency: 3
  evaluation_timeout: 300

